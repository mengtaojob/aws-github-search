name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: github_app
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: github_search_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U github_app -d github_search_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://github_app:ci_test_only@localhost:5432/github_search_test
          DATABASE_SSL: 'false'
          ALLOW_TEST_DATABASE: 'true'
      - run: npm run infra:check
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infrastructure/template.yaml --region ap-southeast-2
      - run: sam validate --lint --template-file infrastructure/free-api.yaml --region ap-southeast-2
      - run: sam validate --lint --template-file infrastructure/rds-network.yaml --region ap-southeast-2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo export --platform android
        working-directory: mobile

