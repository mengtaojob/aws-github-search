name: Deploy Cloudflare and AWS
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          FUNCTION_NAME: ${{ vars.AWS_FUNCTION_NAME }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in API_BASE_URL DEPLOY_ROLE FUNCTION_NAME CF_ACCOUNT CF_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing required variable: $name"; exit 1; fi
          done
      - run: npm run typecheck && npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Deploy Lambda code
        env:
          FUNCTION_NAME: ${{ vars.AWS_FUNCTION_NAME }}
        run: |
          cd dist/lambda
          zip -r ../lambda.zip .
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://../lambda.zip > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
      - name: Health check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: curl --fail --retry 3 "$API_BASE_URL/health"
      - name: Deploy Cloudflare static frontend
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.158.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Check deployed website
        run: curl --fail --retry 3 https://octoshelf-github-search.mengtaojob-7a7.workers.dev/ --output /dev/null
