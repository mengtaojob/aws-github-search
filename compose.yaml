services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: github_app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: github_search
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_app -d github_search"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
